<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
  <title>Voice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e1e;
      --surface: #252525;
      --surface2: #2e2e2e;
      --sidebar-bg: #1a1a1a;
      --sidebar-surface: #222222;
      --sidebar-border: rgba(255,255,255,0.09);
      --sidebar-text: #c0c0c0;
      --sidebar-text-muted: #666;
      --sidebar-hover: rgba(255,255,255,0.06);
      --sidebar-active: rgba(255,255,255,0.11);
      --sidebar-toggle-bg: #2a2a2a;
      --sidebar-toggle-bg-hover: #343434;
      --sidebar-toggle-border: rgba(255,255,255,0.16);
      --sidebar-toggle-icon: #f5f5f5;
      --sidebar-toggle-shadow: rgba(0,0,0,0.2);
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.16);
      --text: #f2f2f2;
      --text-muted: #888;
      --text-hint: #444;
      --accent: #9b8ef0;
      --accent-light: #1a1740;
      --accent-border: #352870;
      --danger: #f87171;
      --danger-light: #2a0f0f;
      --success: #4ade80;
      --radius: 8px;
      --radius-lg: 12px;
      --sidebar-w: 260px;
    }

    [data-theme="light"] {
      --bg: #f9f9f9;
      --surface: #fff;
      --surface2: #f2f2f2;
      --sidebar-bg: #f4f4f4;
      --sidebar-surface: #eaeaea;
      --sidebar-border: rgba(0,0,0,0.07);
      --sidebar-text: #444;
      --sidebar-text-muted: #999;
      --sidebar-hover: rgba(0,0,0,0.04);
      --sidebar-active: rgba(0,0,0,0.07);
      --sidebar-toggle-bg: #7a7a7a;
      --sidebar-toggle-bg-hover: #6f6f6f;
      --sidebar-toggle-border: rgba(0,0,0,0.12);
      --sidebar-toggle-icon: #ffffff;
      --sidebar-toggle-shadow: rgba(0,0,0,0.06);
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.13);
      --text: #111;
      --text-muted: #888;
      --text-hint: #ccc;
      --accent: #6355c7;
      --accent-light: #eeeaff;
      --accent-border: #c4bdf5;
      --danger: #e03e3e;
      --danger-light: #fdeaea;
      --success: #1a9e50;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sidebar-border);
      height: 100vh;
      transition: transform 0.22s ease, width 0.22s ease, min-width 0.22s ease;
    }

    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 10px;
      font-weight: 500;
      color: var(--sidebar-text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .sidebar-clear {
      font-size: 11px;
      color: var(--sidebar-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-family: inherit;
      transition: color 0.12s;
    }

    .sidebar-clear:hover { color: var(--sidebar-text); }

    .sidebar-header-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--sidebar-text-muted);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    .sidebar-header-btn:hover { color: var(--sidebar-text); }

    [data-theme="light"] .sidebar-header-btn {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    [data-theme="light"] .sidebar-header-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,0.96);
      border-color: rgba(0,0,0,0.1);
    }

    .sidebar-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-header-btn.active {
      color: var(--sidebar-text);
      background: var(--sidebar-hover);
      box-shadow: inset 0 0 0 1px rgba(124, 109, 224, 0.2);
    }

    [data-theme="light"] .sidebar-header-btn.active {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent-border);
      box-shadow: 0 1px 3px rgba(99, 85, 199, 0.12);
    }

    .sidebar-search {
      padding: 8px 10px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .sidebar-search input {
      width: 100%;
      background: var(--sidebar-surface);
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      color: var(--sidebar-text);
      font-size: 12px;
      padding: 6px 9px;
      outline: none;
      font-family: inherit;
    }

    .sidebar-search input::placeholder { color: var(--sidebar-text-muted); }
    .sidebar-search input:focus { border-color: rgba(124,109,224,0.4); }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
      scrollbar-width: thin;
      scrollbar-color: #3a3a3a transparent;
    }

    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }

    .history-empty {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--sidebar-text-muted);
      font-size: 12px;
      line-height: 1.9;
    }

    .sidebar-settings-panel {
      flex: 1;
      padding: 16px 12px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .sidebar-settings-panel .field {
      gap: 6px;
    }

    .sidebar-settings-panel label {
      color: var(--sidebar-text-muted);
    }

    .sidebar-settings-panel select {
      background: var(--sidebar-surface);
      border-color: var(--sidebar-border);
      color: var(--sidebar-text);
    }

    .sidebar-settings-panel .settings-note {
      font-size: 12px;
      line-height: 1.6;
      color: var(--sidebar-text-muted);
    }

    .history-empty svg { display: block; margin: 0 auto 10px; opacity: 0.2; }

    .history-item {
      margin: 1px 6px;
      padding: 9px 26px 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      position: relative;
    }

    .history-item:hover { background: var(--sidebar-hover); }
    .history-item.active { background: var(--sidebar-active); }

    .h-text {
      font-size: 12px;
      color: var(--sidebar-text);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .h-meta {
      font-size: 10px;
      color: var(--sidebar-text-muted);
      margin-top: 4px;
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .h-dot { width: 2px; height: 2px; border-radius: 50%; background: #555; flex-shrink: 0; }

    .h-lang {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(124,109,224,0.14);
      color: #a5b4fc;
      font-weight: 500;
    }

    .h-del {
      position: absolute;
      top: 7px;
      right: 6px;
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s;
    }

    .history-item:hover .h-del { opacity: 1; }
    .h-del:hover { color: var(--danger); }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--sidebar-border);
      font-size: 10px;
      color: var(--sidebar-text-muted);
      flex-shrink: 0;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 2.5rem 1.5rem 6rem;
      gap: 1rem;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      text-align: center;
      padding-bottom: 0.25rem;
    }

    header h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
    }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    select {
      background: var(--surface2);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 7px 9px;
      cursor: pointer;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    select:focus { border-color: var(--accent); }

    /* ── Recording controls ── */
    .record-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: #1c1c1c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    .record-btn:hover {
      border-color: rgba(255,255,255,0.45);
      background: #262626;
      box-shadow: 0 0 28px rgba(255,255,255,0.05);
    }

    .record-btn.recording {
      border-color: var(--danger);
      background: var(--danger-light);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .record-btn.processing {
      border-color: var(--accent);
      background: var(--accent-light);
      cursor: default;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.18); }
      50%       { box-shadow: 0 0 0 12px rgba(248,113,113,0); }
    }

    .mic-icon { width: 24px; height: 24px; color: #bbb; }

    .stop-icon { width: 15px; height: 15px; background: var(--danger); border-radius: 3px; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--accent-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .record-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timer-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .timer {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      min-width: 42px;
    }

    .cancel-btn {
      border: 1px solid rgba(248,113,113,0.3);
      background: transparent;
      color: var(--danger);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.12s, border-color 0.12s;
    }

    .cancel-btn:hover {
      background: rgba(248,113,113,0.08);
      border-color: rgba(248,113,113,0.5);
    }

    .cancel-icon {
      font-size: 11px;
      line-height: 1;
    }

    /* ── Transcript ── */
    .transcript-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .transcript-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn-small {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      font-family: inherit;
    }

    .btn-small:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
    }

    #transcript-box {
      width: 100%;
      min-height: 130px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      resize: vertical;
      font-family: inherit;
      outline: none;
    }

    #transcript-box:focus { border-color: rgba(124,109,224,0.35); }
    #transcript-box::placeholder { color: var(--text-hint); }

    .meta-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: none;
    }

    .badge.visible { display: inline-block; }

    /* ── Status bar ── */
    .status-bar {
      position: fixed;
      bottom: 22px;
      left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2);
      transform: translateX(-50%) translateY(8px);
      background: #2a2a2a;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-bar.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .status-bar::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .status-bar.error  { color: var(--danger); }
    .status-bar.error::before  { background: var(--danger); }
    .status-bar.success { color: var(--success); }
    .status-bar.success::before { background: var(--success); }
    .status-bar.loading::before { background: var(--accent); animation: pulse-dot 1s ease-in-out infinite; }

    .completion-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.96);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 2000;
    }

    .completion-toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .completion-toast .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.16);
      flex-shrink: 0;
    }

    [data-theme="light"] .completion-toast {
      background: rgba(255,255,255,0.96);
      color: var(--text);
      border-color: rgba(0,0,0,0.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @media (max-width: 700px) { .status-bar { left: 50%; } }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 5px 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 11px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .theme-toggle:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.22);
    }

    [data-theme="light"] .theme-toggle:hover {
      border-color: rgba(0,0,0,0.22);
    }

    /* ── Sidebar toggle button ── */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 100;
      background: var(--sidebar-toggle-bg);
      border: 1px solid var(--sidebar-toggle-border);
      border-radius: 7px;
      padding: 7px 9px;
      cursor: pointer;
      color: var(--sidebar-toggle-icon);
      box-shadow: 0 2px 6px var(--sidebar-toggle-shadow);
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s;
    }

    .sidebar-toggle:hover {
      background: var(--sidebar-toggle-bg-hover);
      transform: translateY(-1px);
    }

    .sidebar-toggle svg {
      display: block;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .main { padding-top: 3.5rem; }
    }

    /* ── Desktop sidebar collapse ── */
    @media (min-width: 701px) {
      body.sidebar-hidden .sidebar {
        width: 0;
        min-width: 0;
        overflow: hidden;
        border-right-width: 0;
      }

      body.sidebar-hidden .sidebar-toggle {
        display: flex;
      }

      body.sidebar-hidden .status-bar {
        left: 50%;
      }
    }
  </style>
</head>

<body>

  <button class="sidebar-toggle" id="sidebar-toggle">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="sidebar-title">History</h2>
      <div class="sidebar-header-actions">
        <button class="sidebar-header-btn" id="sidebar-view-toggle" onclick="toggleSidebarView()" title="Open settings">
          <svg id="sidebar-view-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a9.94 9.94 0 0 0-8 4.2A9.94 9.94 0 0 0 12 21a9.94 9.94 0 0 0 8-4.2A9.94 9.94 0 0 0 12 3Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="sidebar-header-btn" onclick="toggleSidebar()" title="Hide sidebar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="sidebar-search" id="sidebar-search">
      <input type="text" id="search-input" placeholder="Search..." oninput="filterHistory()" />
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        No recordings yet.<br>Start speaking to build your history.
      </div>
    </div>
    <div class="sidebar-settings-panel" id="sidebar-settings-panel">
      <div class="field">
        <label>Model</label>
        <select id="model-select">
          <option value="base" selected>Base</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
        </select>
      </div>
      <div class="field">
        <label>Language</label>
        <select id="lang-select">
          <option value="auto">Auto detect</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="gu">Gujarati</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
        </select>
      </div>
      <div class="field">
        <label>Theme</label>
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="field">
        <label>Notifications</label>
        <select id="notifications-select">
          <option value="auto">Auto (inactive tab only)</option>
          <option value="always">Always</option>
          <option value="off">Off</option>
        </select>
        <div class="settings-note">Completion alerts appear only when this tab is not active unless you choose Always.</div>
      </div>
    </div>
    <div class="sidebar-footer" id="sidebar-footer">
      <span id="history-count">0 recordings</span>
      <button class="sidebar-clear" onclick="clearHistory()">Clear all</button>
    </div>
  </aside>

  <main class="main">
    <div class="container">

      <div class="card">
        <div class="transcript-header">
          <div class="record-controls">
            <button class="record-btn" id="record-btn" title="Start or stop recording">
              <svg class="mic-icon" id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="13" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="8" y1="22" x2="16" y2="22"/>
              </svg>
              <div class="stop-icon" id="stop-icon" style="display:none;"></div>
              <div class="spinner" id="spinner" style="display:none;"></div>
            </button>
            <div class="timer-group">
              <div class="timer" id="timer">0:00</div>
              <button class="cancel-btn" id="cancel-btn" style="display:none;" title="Cancel current recording">
                <span class="cancel-icon">✕</span>
                <span>Cancel</span>
              </button>
            </div>
          </div>
          <div class="transcript-actions">
            <button class="btn-small" onclick="copyText()">Copy</button>
            <button class="btn-small" onclick="copyLastText()">Copy last</button>
            <button class="btn-small" onclick="clearTranscript()">Clear</button>
          </div>
        </div>
        <textarea id="transcript-box" placeholder="Your transcribed text will appear here..."></textarea>
      </div>

    </div>
  </main>

  <div class="status-bar" id="status-bar">Connecting...</div>
  <div class="completion-toast" id="completion-toast" aria-live="polite">
    <span class="dot"></span>
    <span>Transcription complete</span>
  </div>

  <script>
    const recordBtn = document.getElementById("record-btn");
    const micIcon = document.getElementById("mic-icon");
    const stopIcon = document.getElementById("stop-icon");
    const spinner = document.getElementById("spinner");
    const transcriptBox = document.getElementById("transcript-box");
    const timerEl = document.getElementById("timer");
    const cancelBtn = document.getElementById("cancel-btn");
    const statusBar = document.getElementById("status-bar");
    const historyList = document.getElementById("history-list");
    const modelSelect = document.getElementById("model-select");
    const langSelect = document.getElementById("lang-select");
    const themeSelect = document.getElementById("theme-select");
    const notificationsSelect = document.getElementById("notifications-select");
    const searchInput = document.getElementById("search-input");
    const historyCount = document.getElementById("history-count");
    const sidebarTitle = document.getElementById("sidebar-title");
    const sidebarSearch = document.getElementById("sidebar-search");
    const sidebarFooter = document.getElementById("sidebar-footer");
    const sidebarSettingsPanel = document.getElementById("sidebar-settings-panel");
    const sidebarViewToggle = document.getElementById("sidebar-view-toggle");
    const sidebarViewIcon = document.getElementById("sidebar-view-icon");
    const completionToast = document.getElementById("completion-toast");

    let ws, mediaRecorder, audioChunks = [];
    let audioContext, analyser, sourceNode;
    let isRecording = false, isProcessing = false;
    let timerInterval, startTime;
    let recordingCancelled = false;
    let activeId = null;
    let transcribeStart = 0;
    let history = [];
    let sidebarView = "history";
    let themePreference = localStorage.getItem("themePreference") || "system";
    let notificationPreference = localStorage.getItem("stt_notification_preference") || "auto";
    let completionNoticeShown = false;
    let completionTitleTimer = null;
    const defaultTitle = document.title;

    try { history = JSON.parse(localStorage.getItem("stt_history") || "[]"); } catch (e) { history = []; }
    try {
      const savedModel = localStorage.getItem("stt_model") || "base";
      const savedLang = localStorage.getItem("stt_language") || "auto";
      const savedNotifications = localStorage.getItem("stt_notification_preference") || "auto";
      modelSelect.value = savedModel;
      langSelect.value = savedLang;
      if (notificationsSelect) notificationsSelect.value = savedNotifications;
      notificationPreference = savedNotifications;
    } catch (e) {}

    function resetCompletionNotice() {
      completionNoticeShown = false;
      clearTimeout(completionTitleTimer);
      document.title = defaultTitle;
      completionToast.classList.remove("visible");
    }

    function shouldShowCompletionNotice() {
      if (notificationPreference === "off") return false;
      if (notificationPreference === "always") return true;
      return document.hidden || !document.hasFocus();
    }

    function showCompletionNotice() {
      if (completionNoticeShown || !shouldShowCompletionNotice()) return;
      completionNoticeShown = true;
      clearTimeout(completionTitleTimer);
      document.title = "Voice • Done";
      completionToast.classList.add("visible");
      completionTitleTimer = setTimeout(() => {
        document.title = defaultTitle;
        completionToast.classList.remove("visible");
      }, 6000);

      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("Voice transcription complete", {
            body: "Your transcript is ready.",
            icon: "/assets/favicon.png"
          });
        } catch (e) {}
      } else if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().catch(() => {});
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        clearTimeout(completionTitleTimer);
        document.title = defaultTitle;
        completionToast.classList.remove("visible");
      }
    });

    window.addEventListener("focus", () => {
      clearTimeout(completionTitleTimer);
      document.title = defaultTitle;
      completionToast.classList.remove("visible");
    });

    // ── WebSocket ──
    function connectWS() {
      ws = new WebSocket(`ws://${location.host}/ws/transcribe`);
      ws.onopen = () => setStatus("Ready", "");
      ws.onclose = () => { setStatus("Disconnected. Retrying...", "error"); setTimeout(connectWS, 2000); };
      ws.onerror = () => setStatus("Connection error", "error");
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.status === "processing") {
          transcribeStart = performance.now();
          resetCompletionNotice();
          setStatus("Transcribing...", "loading");
        } else if (msg.status === "done") {
          const r = msg.result;
          const existing = transcriptBox.value.trim();
          transcriptBox.value = existing ? existing + "\n\n" + r.text : r.text;
          addHistory(r.text, r.language, r.duration, r.language_probability);
          showCompletionNotice();
          setStatus("Done", "success");
          setProcessing(false);
        } else if (msg.status === "error") {
          setStatus("Error: " + msg.message, "error");
          setProcessing(false);
        } else if (msg.status === "model_ready") {
          setStatus("Model '" + msg.model + "' loaded", "success");
        }
      };
    }

    let statusTimeout;
    function setStatus(msg, cls) {
      clearTimeout(statusTimeout);
      statusBar.textContent = msg;
      statusBar.className = "status-bar visible " + (cls || "");
      const delay = cls === "error" ? 5000 : cls === "success" ? 3000 : 0;
      if (delay) statusTimeout = setTimeout(() => statusBar.classList.remove("visible"), delay);
    }

    // ── History ──
    function saveHistory() {
      try { localStorage.setItem("stt_history", JSON.stringify(history)); } catch (e) { }
    }

    function addHistory(text, lang, dur, conf) {
      if (!text) return;
      const id = Date.now();
      const now = new Date();
      history.unshift({
        id, text, lang, dur, conf,
        ts: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        date: now.toLocaleDateString([], { month: "short", day: "numeric" })
      });
      if (history.length > 200) history.pop();
      saveHistory();
      renderHistory(searchInput.value);
      setActive(id);
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderHistory(filter) {
      filter = (filter || "").toLowerCase();
      const filtered = filter ? history.filter(h => h.text.toLowerCase().includes(filter)) : history;

      if (!filtered.length) {
        historyList.innerHTML = `<div class="history-empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        ${filter ? "No results found." : "No recordings yet.<br>Start speaking to build your history."}
      </div>`;
        historyCount.textContent = "0 recordings";
        return;
      }

      historyCount.textContent = filtered.length + " recording" + (filtered.length !== 1 ? "s" : "");
      historyList.innerHTML = filtered.map(h => `
      <div class="history-item ${h.id === activeId ? "active" : ""}" data-id="${h.id}" onclick="loadHistory(${h.id})">
        <div class="h-text">${escHtml(h.text)}</div>
        <div class="h-meta">
          <span>${h.date} ${h.ts}</span>
          ${h.lang ? `<span class="h-dot"></span><span class="h-lang">${escHtml(h.lang)}</span>` : ""}
          ${h.dur ? `<span class="h-dot"></span><span>${h.dur}s</span>` : ""}
        </div>
        <button class="h-del" onclick="deleteHistory(event,${h.id})" title="Delete">&#x2715;</button>
      </div>
    `).join("");
    }

    function loadHistory(id) {
      const item = history.find(h => h.id === id);
      if (!item) return;
      transcriptBox.value = item.text;
      setActive(id);
    }

    function setActive(id) {
      activeId = id;
      document.querySelectorAll(".history-item").forEach(el => {
        el.classList.toggle("active", parseInt(el.dataset.id) === id);
      });
    }

    function deleteHistory(e, id) {
      e.stopPropagation();
      history = history.filter(h => h.id !== id);
      if (activeId === id) activeId = null;
      saveHistory();
      renderHistory(searchInput.value);
    }

    function clearHistory() {
      if (!history.length || !confirm("Clear all history?")) return;
      history = []; activeId = null;
      saveHistory(); renderHistory();
    }

    function filterHistory() { renderHistory(searchInput.value); }

    function showSidebarView(view) {
      sidebarView = view;
      const isSettings = view === "settings";
      sidebarSearch.style.display = isSettings ? "none" : "";
      historyList.style.display = isSettings ? "none" : "";
      sidebarFooter.style.display = isSettings ? "none" : "";
      sidebarSettingsPanel.style.display = isSettings ? "flex" : "none";
      sidebarTitle.textContent = isSettings ? "Settings" : "History";
      sidebarViewToggle.title = isSettings ? "Back to history" : "Open settings";
      sidebarViewToggle.classList.toggle("active", isSettings);
      sidebarViewIcon.innerHTML = isSettings ? `
        <path d="M15 18L9 12l6-6"/>
      ` : `
        <path d="M12 3a9.94 9.94 0 0 0-8 4.2A9.94 9.94 0 0 0 12 21a9.94 9.94 0 0 0 8-4.2A9.94 9.94 0 0 0 12 3Z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
    }

    function toggleSidebarView() {
      showSidebarView(sidebarView === "history" ? "settings" : "history");
    }

    // ── Recording ──
    recordBtn.addEventListener("click", async () => {
      if (isProcessing) return;
      isRecording ? stopRecording() : await startRecording();
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
        audioContext = new AudioContext({ sampleRate: 16000 });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingCancelled = false;
        cancelBtn.style.display = "inline-flex";
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          if (recordingCancelled) {
            cancelBtn.style.display = "none";
            setStatus("Recording cancelled", "");
            return;
          }
          processRecording();
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add("recording");
        micIcon.style.display = "none"; stopIcon.style.display = "block";
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 500);
      } catch (err) {
        setStatus("Microphone access denied: " + err.message, "error");
      }
    }

    function stopRecording(cancelled = false) {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      isRecording = false;
      recordingCancelled = cancelled;
      clearInterval(timerInterval);
      timerEl.textContent = "0:00";
      recordBtn.classList.remove("recording");
      stopIcon.style.display = "none";
      cancelBtn.style.display = "none";
      micIcon.style.display = "block";
      spinner.style.display = "none";
      recordBtn.classList.remove("processing");
      if (cancelled) {
        isProcessing = false;
        setStatus("Recording cancelled", "");
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        recordBtn.classList.add("processing");
        spinner.style.display = "block"; micIcon.style.display = "none";
        isProcessing = true;
        setStatus("Sending audio for transcription...", "");
      }
      if (mediaRecorder.stream) {
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
      if (mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    function setProcessing(val) {
      isProcessing = val;
      spinner.style.display = val ? "block" : "none";
      if (!val) { micIcon.style.display = "block"; recordBtn.classList.remove("processing"); }
    }

    cancelBtn.addEventListener("click", () => {
      if (!isRecording) return;
      stopRecording(true);
    });

    async function processRecording() {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const buf = await blob.arrayBuffer();
      const decoded = await new AudioContext({ sampleRate: 16000 }).decodeAudioData(buf);
      const ch = decoded.getChannelData(0);
      const int16 = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) int16[i] = Math.max(-32768, Math.min(32767, ch[i] * 32767));
      ws.send(JSON.stringify({ action: "transcribe", audio: Array.from(int16), model: modelSelect.value, language: langSelect.value }));
    }

    function updateTimer() {
      const s = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    async function copyText() {
      const text = transcriptBox.value.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
      setStatus("Copied full transcript", "success");
    }

    async function copyLastText() {
      const text = transcriptBox.value.trim();
      if (!text) return;
      const parts = text.split(/\n\s*\n+/).map(p => p.trim()).filter(Boolean);
      const lastPart = parts.at(-1) || text.trim();
      await navigator.clipboard.writeText(lastPart);
      setStatus("Copied last message", "success");
    }

    function clearTranscript() {
      transcriptBox.value = ""; activeId = null;
      document.querySelectorAll(".history-item").forEach(el => el.classList.remove("active"));
    }

    document.getElementById("sidebar-toggle").addEventListener("click", () => {
      toggleSidebar();
    });

    function toggleSidebar() {
      if (window.innerWidth <= 700) {
        document.getElementById("sidebar").classList.toggle("open");
      } else {
        document.body.classList.toggle("sidebar-hidden");
      }
    }

    modelSelect.addEventListener("change", () => {
      localStorage.setItem("stt_model", modelSelect.value);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ action: "preload", model: modelSelect.value }));
        setStatus("Loading model '" + modelSelect.value + "'...", "");
      }
    });

    langSelect.addEventListener("change", () => {
      localStorage.setItem("stt_language", langSelect.value);
    });

    notificationsSelect?.addEventListener("change", () => {
      notificationPreference = notificationsSelect.value;
      localStorage.setItem("stt_notification_preference", notificationPreference);
    });

    // ── Theme settings ──
    function getSystemTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(preference = themePreference) {
      themePreference = preference;
      const resolvedTheme = preference === "system" ? getSystemTheme() : preference;
      document.documentElement.setAttribute("data-theme", resolvedTheme);
      if (themeSelect) themeSelect.value = preference;
      localStorage.setItem("themePreference", preference);
    }

    themeSelect?.addEventListener("change", () => {
      applyTheme(themeSelect.value);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themePreference === "system") {
        applyTheme("system");
      }
    });

    applyTheme(themePreference);
    document.body.classList.add("sidebar-hidden");

    showSidebarView(sidebarView);
    renderHistory();
    connectWS();
  </script>
</body>

</html>
